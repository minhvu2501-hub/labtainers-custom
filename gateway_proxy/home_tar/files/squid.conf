# squid.conf  -  gateway_content_disarm lab
# Proxy lắng nghe tại port 3128, đẩy audio/wav qua ICAP scrubber

http_port 3128

# ── ICAP Configuration ─────────────────────────────────────────────
icap_enable on
icap_send_client_ip on
icap_send_client_username on
icap_log /var/log/squid/icap.log

# Định nghĩa ICAP service (ICAP server chạy trên cổng 1344)
icap_service wav_scrubber respmod_precache bypass=off icap://127.0.0.1:1344/scrub

# ACL: chỉ gửi response có Content-Type audio/wav qua ICAP
acl audio_wav_type rep_mime_type -i audio/wav
acl audio_wav_type rep_mime_type -i audio/x-wav

# Áp dụng ICAP service cho audio WAV responses
adaptation_service_set wav_check wav_scrubber
adaptation_access wav_check allow audio_wav_type
adaptation_access wav_check deny all

# ── Access Control ─────────────────────────────────────────────────
acl localnet src 10.0.0.0/24
http_access allow localnet
http_access deny all

# ── Logging ────────────────────────────────────────────────────────
access_log /var/log/squid/access.log
cache_log  /var/log/squid/cache.log

# ── Misc ───────────────────────────────────────────────────────────
coredump_dir /var/spool/squid
